<VirtualHost *:80>
    ServerName viabix.com.br
    ServerAlias www.viabix.com.br app.viabix.com.br
    DocumentRoot /var/www/viabix
    <Directory /var/www/viabix>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html index.php
    </Directory>
    <FilesMatch "(^\.|\.(sql|log|ini|bak|sh|ps1|md|ya?ml)$|^composer\.|^docker-compose)">
        Require all denied
    </FilesMatch>
    <LocationMatch "(?i)^/(?:\.|BD(?:/|$)|deploy(?:/|$)|scripts(?:/|$)|tests(?:/|$)|docs(?:/|$)|logs(?:/|$)|vendor(?:/|$)|templates(?:/|$)|api/lib(?:/|$))">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)/(?:setup[^/]*|debug_[^/]*|test_[^/]*|schema_maintenance|diagnostico[^/]*|diagnose[^/]*|generate_test_token|check_mysql_users|create_db_user|criar_banco|criar_db|importar_db|unificar_bancos)\.(php|html)$">
        Require all denied
    </LocationMatch>
    <Directory /var/www/viabix/uploads>
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^app\.viabix\.com\.br$ [NC]
    RewriteRule ^/?$ /login.html [R=302,L]
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN
    Header always set Referrer-Policy strict-origin-when-cross-origin
    ErrorLog /var/log/apache2/viabix-error.log
    CustomLog /var/log/apache2/viabix-access.log combined
</VirtualHost>
